# whisper v2 configuration

# Path to perception-voice server socket (relative to this file, or absolute)
perception_voice:
  socket_path: "tmp/perception-voice/perception.sock"

# Hotkeys to toggle listening on/off
shortcuts:
  # sendkeys mode: transcription is typed character-by-character
  toggle_listening: "ctrl+shift+space"
  # clipboard mode: transcription is written to clipboard then pasted via Ctrl+V
  toggle_listening_clipboard: "alt+space"
  # push_to_talk: false  # when true: hold key to listen, release to stop
  # buffer_until_release: true  # hold transcription output until key release (no-op without push_to_talk)
  # Delay (ms) after releasing PTT before typing begins (debounce for key-release events)
  ptt_release_delay_ms: 250

# Keyboard typing configuration
keyboard:
  # Milliseconds delay between each keystroke (prevents skipping in some input contexts)
  # 4ms works well for USB HID gadget (Orange Pi kvm-server); increase if keys are dropped
  typing_delay_ms: 4
  # Milliseconds to hold key down before release (for SDL2/game input compatibility)
  key_hold_ms: 4
  # Phrases to discard (misheard sounds like coughs/sneezes)
  discard_phrases:
    - "thank you"

# Word mappings: spoken words -> keyboard output
# Can be text replacements or hotkeys (format: "ctrl+z")
word_mappings:
  "new line": "\n"
  "insert bullet": "- "
  "completion": "\t"

  # Placeholders: {{clipboard}} is replaced with the current clipboard
  # contents (read via xclip) at the moment the mapping is spoken.
  "insert citation": "- {{clipboard}}:"

  "end of sentence": "."
  "dot": "."
  "comma": ","
  "question mark": "?"
  "exclamation point": "!"
  "colon": ":"
  "semicolon": ";"
  # Hotkeys (will be executed as keyboard shortcuts)
  "now undo": "ctrl+z"
  "now redo": "ctrl+y"
  "now copy": "ctrl+c"
  "now paste": "ctrl+v"
  "now cut": "ctrl+x"
  "now save": "ctrl+s"

# Command mappings: exact spoken phrases -> shell commands
# Matching lowercases and strips non-letters down to word separators before comparison.
# These run only when the full buffered phrase exactly matches after a pause.
#
# Wildcard (*) support: use * to capture any words spoken after the prefix.
# The captured words are substituted wherever $WORDS appears in the command.
# Example: saying "home agent turn the lights blue" runs the command with
#   $WORDS = "turn the lights blue"
command_mappings:
  "work password": "~/wlogin.sh"
  "work duo": "~/duo.sh"
  # "home agent *": cd /workspace/agl && bun src/agents/home.mjs "$WORDS"

# Activation keywords: always-on phrases checked even when listening is OFF.
# Values can be magic strings or shell commands.
#
# Magic strings:
#   LISTENING_ON               - start listening (sendkeys mode)
#   LISTENING_OFF              - stop listening
#   LISTENING_TOGGLE           - toggle listening (sendkeys mode)
#   LISTENING_ON_CLIPBOARD     - start listening (clipboard-paste mode)
#   LISTENING_TOGGLE_CLIPBOARD - toggle listening (clipboard-paste mode)
#
# activation_keywords:
#   "work activate": LISTENING_ON
#   "work deactivate": LISTENING_OFF
#   "work clipboard": LISTENING_ON_CLIPBOARD

# Sound effects
sounds:
  enabled: true
  on_listening_start: "sfx/squelch-on.wav"
  on_listening_stop: "sfx/click-off.wav"
  # Delay (ms) after hotkey press before resuming/pausing audio polling
  listening_state_delay_ms: 50

# Polling interval for checking perception-voice server (ms)
# Lower = less latency between transcription finishing and text appearing
polling:
  interval_ms: 25

# Logging
logging:
  timestamps: true
  verbose: false
