[package]
name = "whisper"
version = "3.0.0"
edition = "2021"
license = "MIT"
authors = ["Mike Smullin <mike@smullindesign.com>"]
description = "Voice keyboard - speech-to-text typing via perception-voice"

[dependencies]
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
crossbeam-channel = "0.5.17"
regex = "1.12.3"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
x11rb = { version = "0.14.0", features = ["xtest", "randr"] }
rodio = "0.23.0"
indexmap = { version = "2.12.0", features = ["serde"] }
signal-hook = "0.4.6"

[lib]
name = "whisper"
path = "src/lib.rs"

[[bin]]
name = "whisper"
path = "src/main.rs"

[[bin]]
name = "keycapture"
path = "src/bin/keycapture.rs"
